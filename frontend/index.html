<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT-like UI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Highlight.js CSS for Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <!-- Marked.js and Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <button class="new-chat-btn" id="newChatBtn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>
            
            <div class="sidebar-section">
                <p class="section-label">Model Selection</p>
                <div class="select-wrapper">
                    <select id="modelSelect">
                        <option value="">Loading models...</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-icon"></i>
                </div>
            </div>

            <div class="chat-history">
                <p class="section-label">Recent</p>
                <ul class="history-list" id="historyList">
                    <!-- History items will be dynamically loaded here -->
                    <div style="padding:10px; color:blacķ; font-size:12px;">No recent chats</div>
                </ul>
            </div>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span>User Profile</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="header-model-title" id="headerModelTitle">
                    Loading... <span class="model-badge">Default</span>
                </div>
            </header>

            <!-- Chat Container -->
            <div class="chat-container" id="chatContainer">
                <!-- Welcome screen for new chat -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-logo">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h1>How can I help you today?</h1>
                </div>
                
                <!-- Messages will appear here -->
                <div class="messages-wrapper" id="messagesWrapper" style="display: none;">
                    <!-- Example messages will be added dynamically -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <button class="icon-btn" id="fileUploadBtn" title="Upload File">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <textarea id="messageInput" placeholder="Message ChatGPT..." rows="1"></textarea>
                    <button class="icon-btn" id="voiceBtn" title="Voice Input">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button class="send-btn" id="sendBtn" disabled>
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
                <p class="disclaimer">Offline chatbot may be slow can make be slow so keep patience😁</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
